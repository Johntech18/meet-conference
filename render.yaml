services:
  - type: web
    name: livekit-server
    runtime: image
    image:
      url: docker.io/livekit/livekit-server:latest
    envVars:
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
    cmd: ["livekit-server", "--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    healthCheckPath: /
    ports:
      - port: 7880
        type: tcp
      - port: 7881
        type: tcp
      - port: 50000-60000
        type: udp
